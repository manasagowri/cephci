#   extra cluster   : tala022–tala026
#   clients         : tala001 (node26, 10.64.0.187), tala027 (node27, 10.64.0.213)
#
# Suggested run:
#   conf/tentacle/nvmeof/ceph_nvmeof_byok_baremetal.yaml
#   suites/tentacle/nvmeof/tier-3_nvmeof_byok_kmip.yaml
#   --cloud baremetal
