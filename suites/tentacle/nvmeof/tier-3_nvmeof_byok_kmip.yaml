  # Use the entry below when namespaces are ALREADY deleted and you only want
  # to add them back from the existing encrypted RBD images (no delete phase).
  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node9
          - node10
          - node11
          - node12
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: group2
        install: false
        do_not_create_pool: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        subsystems: 32
        namespaces_per_subsystem: 16
        subsystems_per_kmip: 2
        kmip_cli_image: quay.io/gdidi/kmip/kmip-cli:latest
        kmip_port: 5696
        enable_ha: true
        listener_port: 4420
        add_only: true   # skip snapshot-from-ns-list and delete phase
      desc: >
        Re-add all 512 encrypted BYOK parent namespaces directly from the
        existing encrypted RBD images using KMIP to resolve key UUIDs.
        No delete phase is run.  Safe to re-run multiple times (idempotent).
      destroy-cluster: false
      module: test_ceph_nvmeof_byok_ns_readd.py
      name: BYOK ns add-only 512 namespaces from existing RBD images (no delete)

