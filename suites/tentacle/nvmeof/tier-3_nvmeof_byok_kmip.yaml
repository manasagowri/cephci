  #     name: configure Ceph client for NVMe tests
  #     polarion-id: CEPH-83573758

  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node9
          - node10
          - node11
          - node12
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: group2
        install: false
        do_not_create_pool: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        network_mask: 10.64.0.196/30
        subsystems: 32
        namespaces_per_subsystem: 16
        max_namespaces: 32
        image_size: 50G
        kmip_image: quay.io/gdidi/kmip/kmip-server:latest
        kmip_cli_image: quay.io/gdidi/kmip/kmip-cli:latest
        kmip_port: 5696
        subsystems_per_kmip: 2
        enable_ha: true
        listener_port: 4420
        # Keep clones already on the subsystem; retry only missing ones.
        # Remove resume_from after a full successful clone+verify run.
        resume_from: clones
      desc: >
        NVMeoF BYOK scale: 16 KMIP servers, 32 group2 subsystems with
        auto-listeners, encrypted LUKS1/LUKS2 namespaces and clones
      destroy-cluster: false
      module: test_ceph_nvmeof_byok.py
      name: NVMeoF BYOK KMIP scale

  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node9
          - node10
          - node11
          - node12
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: group2
        install: false
        do_not_create_pool: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        subsystems: 32
        namespaces_per_subsystem: 16
        image_size: 50G
        kmip_cli_image: quay.io/gdidi/kmip/kmip-cli:latest
        subsystems_per_kmip: 2
        enable_ha: true
        listener_port: 4420
        run_io: false
        feature_test:
          fio_fill_percent: 50
          fio_subsystems: 2
          masking_subsystems: 2
          ns_per_subsystem: 4
          dhchap_extra_ns: 2
          ha_subsystems: 2
      desc: >
        BYOK feature tests on existing encrypted namespaces: FIO fill,
        namespace masking, DHCHAP, and HA during IO
      destroy-cluster: false
      module: test_ceph_nvmeof_byok_features.py
      name: NVMeoF BYOK feature tests
