# Tier-Level: 3
# NVMeoF BYOK (KMIP) scale on tala baremetal
#
# Cluster configuration:
#   conf/tentacle/nvmeof/ceph_nvmeof_byok_baremetal.yaml
#
# Storage note: default 32 subsystems * 16 parent NS * 50G plus one clone
# each is ~51 TB. Override image_size in the BYOK test config if needed.
#
# Reuse an already-deployed cluster by skipping the bootstrap tests or
# running with --reuse against the existing tala cluster.
#
# Feature tests (FIO fill, masking, DHCHAP, HA) are a separate suite step
# after BYOK scale: test_ceph_nvmeof_byok_features.py

tests:
