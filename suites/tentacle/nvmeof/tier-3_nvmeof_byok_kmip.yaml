  # - test:
  #     abort-on-fail: true
  #     config:
  #       command: add
  #       id: client.1
  #       nodes:
  #         - node26
  #         - node27
  #       install_packages:
  #         - ceph-common
  #       copy_admin_keyring: true
  #     desc: Setup clients for NVMeoF BYOK tests
  #     destroy-cluster: false
