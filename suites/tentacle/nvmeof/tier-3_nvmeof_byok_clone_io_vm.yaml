# VM repro of the BYOK stacked-LUKS clone peer-gateway abort.
#
# Cluster configuration:
#   conf/tentacle/nvmeof/ceph_nvmeof_byok_vm.yaml
#
# Topology in that conf (edit gw_nodes / kmip_nodes if your pickle differs):
#   node1          : installer / KMIP
#   node6–node9    : NVMeoF gateways (group2)
#   node10–node11  : clients
#
# What this run does:
#   1. Dummy KMIP + 1 group2 subsystem + 10 encrypted parent namespaces
#   2. Clone those 10 parents (stacked LUKS) and fail if any gateway restarts
#   3. Create 10 *separate* RBD parents, encrypt them (not as NVMe NS),
#      clone+encrypt, ns-add only the clones, and check for the same abort
#
# FIO is skipped so the run stops at clone ``ns add``, which is where the
# peer OMAP abort happens. Set skip_io: false if you also want clone IO.
# Test 2 keeps running if test 1 hits the abort (abort-on-fail: false).
#
# Example (reuse an existing VM pickle):
#   /Users/manasagowri/git_repo/cephci/venv/bin/python3 run.py \
#     --log-level DEBUG --cloud ibcloud \
#     --osp-cred /Users/manasagowri/git_repo/osp-cred-ci-2_ci.yaml \
#     --inventory conf/inventory/rhel-10.2-server-x86_64.yaml \
#     --instances-name mgowri --release 9.2 --platform rhel-10 \
#     --global-conf conf/tentacle/nvmeof/ceph_nvmeof_byok_vm.yaml \
#     --suite suites/tentacle/nvmeof/tier-3_nvmeof_byok_clone_io_vm.yaml \
#     --custom-config ibm-build=True --build stable \
#     --reuse <pickle> --skip-sos-report
#
# If the pickle IDs are not node6–node9 / KMIP node1, change the lists
# below (the older ibcloud sample used GWs node2/3/5/6 and KMIP node8).

tests:
  # Uncomment for a fresh VM deploy (not needed with --reuse).
  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: RHCS cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node8
          # - node11
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Setup clients for NVMeoF BYOK tests
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe tests

  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        kmip_nodes:
          - node1
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: group2
        install: true
        do_not_create_pool: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        subsystems: 1
        namespaces_per_subsystem: 10
        max_namespaces: 32
        image_size: 1G
        skip_clones: true
        kmip_image: quay.io/gdidi/kmip/kmip-server:latest
        kmip_cli_image: quay.io/gdidi/kmip/kmip-cli:latest
        kmip_port: 5696
        subsystems_per_kmip: 1
        enable_ha: true
        listener_port: 4420
      desc: >
        VM BYOK setup: dummy KMIP, one group2 subsystem, 10 encrypted
        parent namespaces (no clones)
      destroy-cluster: false
      module: test_ceph_nvmeof_byok.py
      name: NVMeoF BYOK VM parents

  # - test:
  #     abort-on-fail: false
  #     config:
  #       gw_nodes:
  #         - node4
  #         - node5
  #         - node6
  #         - node7
  #       kmip_nodes:
  #         - node1
  #       rbd_pool: rbd
  #       nvme_metadata_pool: rbd
  #       gw_group: group2
  #       install: false
  #       do_not_create_pool: true
  #       do_not_create_image: true
  #       rep-pool-only: true
  #       rep_pool_config:
  #         pool: rbd
  #       subsystems: 1
  #       namespaces_per_subsystem: 10
  #       image_size: 1G
  #       kmip_cli_image: quay.io/gdidi/kmip/kmip-cli:latest
  #       subsystems_per_kmip: 1
  #       enable_ha: true
  #       listener_port: 4420
  #       clone_count: 10
  #       clones_per_subsystem: 10
  #       skip_io: true
  #       save_gateway_logs: true
  #     desc: >
  #       Clone all 10 parents on the single VM subsystem and fail if any
  #       gateway restarts during ns add
  #     destroy-cluster: false
  #     module: test_ceph_nvmeof_byok_clone_io.py
  #     name: NVMeoF BYOK VM clone abort repro

  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        kmip_nodes:
          - node1
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: group2
        install: false
        do_not_create_pool: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        subsystems: 1
        namespaces_per_subsystem: 20
        image_size: 1G
        kmip_cli_image: quay.io/gdidi/kmip/kmip-cli:latest
        subsystems_per_kmip: 1
        enable_ha: true
        listener_port: 4420
        clone_count: 20
        clones_per_subsystem: 20
        clone_only_ns: true
        skip_io: true
        save_gateway_logs: true
      desc: >
        Create 10 RBD parents, encrypt them (not as NVMe NS), clone and
        encrypt, ns-add only the clones, fail if any gateway restarts
      destroy-cluster: false
      module: test_ceph_nvmeof_byok_clone_io.py
      name: NVMeoF BYOK VM clone-only-NS abort repro
