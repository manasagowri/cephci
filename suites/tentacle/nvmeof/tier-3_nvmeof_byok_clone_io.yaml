# Small BYOK clone + IO stability check on tala group2.
#
# Cluster configuration:
#   conf/tentacle/nvmeof/ceph_nvmeof_byok_baremetal.yaml
#
# Creates 10 encrypted clones from existing parent namespaces (one per
# subsystem), FIO randrw on those clones for 10 minutes, and fails if any
# group2 gateway restarts.
#
# Run with --reuse against the existing tala cluster.

tests:
  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node9
          - node10
          - node11
          - node12
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: group2
        install: false
        do_not_create_pool: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        subsystems: 32
        namespaces_per_subsystem: 16
        image_size: 50G
        kmip_cli_image: quay.io/gdidi/kmip/kmip-cli:latest
        subsystems_per_kmip: 2
        enable_ha: true
        listener_port: 4420
        clone_count: 10
        io_runtime: 600
        io_type: randrw
        bs: 64k
        iodepth: 16
        gw_poll_interval: 15
        save_gateway_logs: true
      desc: >
        Add 10 BYOK clones on existing group2 parents, run FIO on the
        clones, and verify all gateways stay up
      destroy-cluster: false
      module: test_ceph_nvmeof_byok_clone_io.py
      name: NVMeoF BYOK clone IO stability
