# Small NVMeoF BYOK (dummy KMIP) sample on a VM cluster.
#
# Cluster configuration:
#   conf/tentacle/nvmeof/ceph_nvmeof_byok_vm.yaml
#
# What this run does (same steps as the 4-GW / 1-KMIP VM repro):
#   1. Deploy quay.io/gdidi/kmip on the KMIP node
#   2. Export unencrypted TLS certs and copy them into every GW container
#   3. Add one group2 subsystem with auto-listeners
#   4. Register the KMIP endpoint
#   5. Add 2 encrypted parent namespaces (LUKS1 then LUKS2)
#   6. Clone each parent and ns-add with stacked --encryption-format
#      (clone,parent) and --key-id clone,parent
#
# Reuse an already-deployed cluster (pickle). Pass the same --global-conf
# that created the pickle. Edit gw_nodes / kmip_nodes if your pickle IDs
# differ. This file is set for the ibcloud repro:
#   gw_nodes: [node2, node3, node5, node6]
#   kmip_nodes: [node8]
# Fresh deploy from ceph_nvmeof_byok_vm.yaml uses GWs node6-node9 and
# KMIP on node1 — switch the lists below if you go that route.
#
# The pickle must include at least one node with role client.
# Example:
#   python3 run.py --rhbuild 9.0 --platform rhel-9 --cloud ibcloud \
#     --global-conf conf/tentacle/nvmeof/ceph_nvmeof_byok_vm.yaml \
#     --suite suites/tentacle/nvmeof/tier-3_nvmeof_byok_vm.yaml \
#     --inventory conf/inventory/rhel-9.8-server-x86_64.yaml \
#     --osp-cred <osp-cred.yaml> --reuse <pickle> --skip-sos-report

