  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node2
          - node3
          - node5
          - node6
        # Dummy KMIP host. The VM conf puts KMIP on node1; the ibcloud
        # pickle used node8. Change this to match your pickle.
        kmip_nodes:
          - node8
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: group1
        install: false
        do_not_create_pool: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        subsystems: 1
        namespaces_per_subsystem: 2
        max_namespaces: 8
        image_size: 1G
        kmip_image: quay.io/gdidi/kmip/kmip-server:latest
        kmip_cli_image: quay.io/gdidi/kmip/kmip-cli:latest
        kmip_port: 5696
        subsystems_per_kmip: 2
        enable_ha: true
        listener_port: 4420
      desc: >
        NVMeoF BYOK VM sample: one dummy KMIP, one group2 subsystem,
        two encrypted parents and stacked-LUKS clones
      destroy-cluster: false
      module: test_ceph_nvmeof_byok.py
      name: NVMeoF BYOK KMIP VM sample
